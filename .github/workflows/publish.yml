name: Publish Library

on:
  push:
    tags:
      - '*/v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Parse tag
        id: parse
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          LIBRARY=${TAG%/v*}
          VERSION=${TAG#*/v}
          echo "library=$LIBRARY" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $LIBRARY version $VERSION"

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 24

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Submit ${{ steps.parse.outputs.library }} to Maven Central
        run: |
          ./gradlew ":${LIBRARY}:publishAndReleaseToMavenCentral" \
            "-Pversion=${VERSION}" \
            -PmavenCentralDeploymentValidation=NONE
        env:
          LIBRARY: ${{ steps.parse.outputs.library }}
          VERSION: ${{ steps.parse.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}

      - name: Stage the exact Central publication bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          bundles = list(Path("build/publish").glob("*.zip"))
          if len(bundles) != 1:
              raise SystemExit(f"Expected one Central bundle, found {len(bundles)}")
          Path("build/publication").mkdir(parents=True, exist_ok=True)
          shutil.copyfile(bundles[0], "build/publication/bundle.zip")
          PY

      - name: Save signed publication bundle
        uses: actions/upload-artifact@v7
        with:
          name: maven-publication
          path: build/publication/bundle.zip
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: notes
        with:
          args: >-
            --latest
            --tag-pattern "^${{ steps.parse.outputs.library }}/v.*"
            --include-path "${{ steps.parse.outputs.library }}/**"
            --exclude-path "${{ steps.parse.outputs.library }}/*.md"
            --exclude-path "${{ steps.parse.outputs.library }}/LICENSE*"
            --exclude-path "${{ steps.parse.outputs.library }}/docs/**"
            --exclude-path "${{ steps.parse.outputs.library }}/src/test/**"
            --exclude-path "${{ steps.parse.outputs.library }}/src/*Test/**"
            --exclude-path "${{ steps.parse.outputs.library }}/src/androidTest/**"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTES: ${{ steps.notes.outputs.content }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "$RELEASE_NOTES"
